[project]
name = "llm-reasoning"
version = "0.1.0"
description = "Small language model built from scratch for mathematical reasoning"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<9"]
data = ["datasets>=3,<5"]
notebook = ["ipykernel>=6,<8"]
model = ["torch>=2.5,<3"]
train = ["tensorboard>=2.18,<3", "numpy>=1.26,<3"]
profile = ["matplotlib>=3.9,<4"]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
